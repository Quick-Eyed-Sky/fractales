name: Release

# Builds the app on a Mac and puts it, zipped, in a *draft* GitHub release.
# Run it from the Actions tab ("Release" > "Run workflow"), or by pushing a tag such as v0.1.0.
# The draft only becomes visible to everyone once "Publish release" is clicked on GitHub.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: |
          VERSION=$(grep -E 'static let version = ' source/FractalModel.swift | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version $VERSION (source/FractalModel.swift)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the app
        run: zsh source/build_app.sh
      - name: Zip the app with the launch instructions
        run: |
          mkdir Fractales
          ditto Fractales.app Fractales/Fractales.app
          cp release/READ-ME.txt release/LISEZ-MOI.txt Fractales/
          ditto -c -k --keepParent Fractales "Fractales-${{ steps.version.outputs.version }}.zip"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          ZIP="Fractales-$VERSION.zip"
          sed "s/{VERSION}/$VERSION/g" release/notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != true ]; then
              echo "Release $TAG is already published: raise the version in source/FractalModel.swift first."
              exit 1
            fi
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --draft --target "$GITHUB_SHA" \
              --title "Fractales $VERSION" --notes-file notes.md
          fi
